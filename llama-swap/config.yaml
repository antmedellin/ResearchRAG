healthCheckTimeout: 180
logLevel: info

# Model names come from the llama-swap container environment (set in
# docker-compose.yaml from .env). ${env.X} fails loudly if X is unset.

# =============================================================================
# Startup
# =============================================================================
hooks:
  on_startup:
    preload:
      - embed            # must be a model ID or alias defined below

# =============================================================================
# Models
# App selects with CHAT_MODEL=chat-<platform>, DECISION_MODEL=decision-<platform>
# =============================================================================
models:

  # ---------------------------------------------------------------------------
  # Chat
  # ---------------------------------------------------------------------------
  chat-vllm:
    name: "Chat Model (vLLM)"
    proxy: "http://127.0.0.1:${PORT}"
    cmd: >
      vllm-wrapper serve
      --vllm-url ${env.VLLM_CHAT_URL}
      --listen :${PORT}
      --wait-timeout 600s
      -- /bin/sh -c "echo Chat vLLM daemon is externally managed; exit 1"
    cmdStop: >
      vllm-wrapper sleep
      --vllm-url ${env.VLLM_CHAT_URL}
      --sleep-level 1
      --stop-pid ${PID}
    checkEndpoint: /health
    useModelName: "${env.VLLM_CHAT_SERVED_MODEL}"
    ttl: 1800
    unloadTimeout: 60

  chat-ollama:
    name: "Chat Model (Ollama)"
    cmd: >
      sh /app/ollama-keeper.sh
      ${env.OLLAMA_CHAT_MODEL}
      chat
    proxy: http://ollama:11434
    checkEndpoint: /api/tags
    useModelName: "${env.OLLAMA_CHAT_MODEL}"
    ttl: 1800
    unloadTimeout: 60

  # ---------------------------------------------------------------------------
  # Decision
  # ---------------------------------------------------------------------------
  decision-vllm:
    name: "Decision Model (vLLM)"
    proxy: "http://127.0.0.1:${PORT}"
    cmd: >
      vllm-wrapper serve
      --vllm-url ${env.VLLM_DECISION_URL}
      --listen :${PORT}
      --wait-timeout 600s
      -- /bin/sh -c "echo Decision vLLM daemon is externally managed; exit 1"
    cmdStop: >
      vllm-wrapper sleep
      --vllm-url ${env.VLLM_DECISION_URL}
      --sleep-level 1
      --stop-pid ${PID}
    checkEndpoint: /health
    useModelName: "${env.VLLM_DECISION_SERVED_MODEL}"
    ttl: 600
    unloadTimeout: 60

  decision-ollama:
    name: "Decision Model (Ollama)"
    cmd: >
      sh /app/ollama-keeper.sh
      ${env.OLLAMA_DECISION_MODEL}
      systemone
    proxy: http://ollama:11434
    checkEndpoint: /api/tags
    useModelName: "${env.OLLAMA_DECISION_MODEL}"
    ttl: 600
    unloadTimeout: 60

  # ---------------------------------------------------------------------------
  # Dense embedding (Ollama, always resident)
  # ---------------------------------------------------------------------------
  embed:
    name: "Dense Embedding Model (Ollama)"
    cmd: >
      sh /app/ollama-keeper.sh
      ${env.DENSE_EMBEDDING_MODEL}
      embed
    proxy: http://ollama:11434
    checkEndpoint: /api/tags
    useModelName: "${env.DENSE_EMBEDDING_MODEL}"
    aliases:
      - "${env.DENSE_EMBEDDING_MODEL}"

# =============================================================================
# External peers
# =============================================================================
peers:
  tei-reranker:
    proxy: http://reranker:80
    models:
      - "${env.RERANK_MODEL}"

# =============================================================================
# Groups
# =============================================================================
groups:
  # Only one large model awake at a time, whichever platform it is on.
  gpu-swap:
    swap: true
    exclusive: false
    members:
      - chat-vllm
      - chat-ollama
      - decision-vllm
      - decision-ollama

  embed-persistent:
    swap: false
    exclusive: false
    persistent: true
    members:
      - embed
