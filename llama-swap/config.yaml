healthCheckTimeout: 180
logLevel: info


# =============================================================================
# Startup
# =============================================================================

hooks:
  on_startup:
    preload:
      - mxbai-embed


# =============================================================================
# Models
# =============================================================================

models:

  # ---------------------------------------------------------------------------
  # Chat model
  # ---------------------------------------------------------------------------

  chat:
    name: "Chat Model (vLLM)"
    proxy: "http://127.0.0.1:${PORT}"

    cmd: >
      vllm-wrapper serve
      --vllm-url http://vllm-chat:8000
      --listen :${PORT}
      --wait-timeout 600s
      -- /bin/sh -c "echo Chat vLLM daemon is externally managed; exit 1"

    cmdStop: >
      vllm-wrapper sleep
      --vllm-url http://vllm-chat:8000
      --sleep-level 1
      --stop-pid ${PID}

    checkEndpoint: /health
    ttl: 1800
    unloadTimeout: 60

    aliases:
      - "gemma4-12b"
      - "gemma4:12b"


  # ---------------------------------------------------------------------------
  # Decision model
  # ---------------------------------------------------------------------------

  decision:
    name: "Decision Model (vLLM)"
    proxy: "http://127.0.0.1:${PORT}"

    cmd: >
      vllm-wrapper serve
      --vllm-url http://vllm-decision:8000
      --listen :${PORT}
      --wait-timeout 600s
      -- /bin/sh -c "echo Decision vLLM daemon is externally managed; exit 1"

    cmdStop: >
      vllm-wrapper sleep
      --vllm-url http://vllm-decision:8000
      --sleep-level 1
      --stop-pid ${PID}

    checkEndpoint: /health
    ttl: 600
    unloadTimeout: 60

    aliases:
      - "clef-flash:9b"


  # ---------------------------------------------------------------------------
  # Dense embedding model
  # ---------------------------------------------------------------------------

  embed:
    name: "Dense Embedding Model (Ollama)"

    cmd: >
      sh /app/ollama-keeper.sh
      mxbai-embed-large:335m
      embed

    proxy: http://ollama:11434
    checkEndpoint: /api/tags
    useModelName: "mxbai-embed-large:335m"

    aliases:
      - "mxbai-embed-large:335m"


# =============================================================================
# External peers
# =============================================================================

peers:

  tei-reranker:
    proxy: http://reranker:80
    models:
      - BAAI/bge-reranker-v2-m3


# =============================================================================
# Resource groups
# =============================================================================

groups:

  # Only one large GPU model may be awake at a time.
  gpu-swap:
    swap: true
    exclusive: false
    members:
      - chat
      - decision

  # Embeddings remain resident in Ollama.
  embed-persistent:
    swap: false
    exclusive: false
    persistent: true
    members:
      - embed
