


name: research-rag

networks:
  backend:
    
volumes:
  qdrant_data:
  neo4j_data:

x-init-ollama: &init-ollama
  image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.16}
  container_name: ollama-pull
  networks:
    - backend
  volumes:
    - ./ollama_storage:/root/.ollama
  entrypoint: ["/bin/sh", "-c"]
  environment:
    CHAT_PLATFORM: ${CHAT_PLATFORM}
    CHAT_MODEL: ${CHAT_MODEL}
    DECISION_PLATFORM: ${DECISION_PLATFORM}
    DECISION_MODEL: ${DECISION_MODEL}
    DENSE_EMBED_PLATFORM: ${DENSE_EMBED_PLATFORM}
    DENSE_EMBEDDING_MODEL: ${DENSE_EMBEDDING_MODEL}
    RERANK_PLATFORM: ${RERANK_PLATFORM}
    RERANK_MODEL: ${RERANK_MODEL}
  command:
      - |
        ollama serve &
        sleep 10

        [ "$$DENSE_EMBED_PLATFORM" = "ollama" ] && ollama pull "$$DENSE_EMBEDDING_MODEL"
        [ "$$RERANK_PLATFORM" = "ollama" ] && ollama pull "$$RERANK_MODEL"
        [ "$$DECISION_PLATFORM" = "ollama" ] && ollama pull "$$DECISION_MODEL"
        [ "$$CHAT_PLATFORM" = "ollama" ] && ollama pull "$$CHAT_MODEL"


x-ollama: &service-ollama
  image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.16}
  container_name: ollama
  networks:
    - backend
  restart: unless-stopped
  ports:
    - "11434:11434"
  volumes:
    - ./ollama_storage:/root/.ollama
  healthcheck:
    test: ["CMD-SHELL", "[ $(ollama list | wc -l) -gt 1 ]"]
    interval: 10s
    timeout: 10s
    retries: 10
    start_period: 60s

services:
  

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.20.2}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 5s
      timeout: 3s
      retries: 4

  qdrant-init:
    image: curlimages/curl:8.12.1
    networks:
      - backend
    depends_on:
      qdrant:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until curl -fsS http://qdrant:6333/readyz >/dev/null; do
          echo "Waiting for Qdrant..."
          sleep 2
        done

        if curl -fsS http://qdrant:6333/collections/${QDRANT_COLLECTION} >/dev/null; then
          echo "Collection ${QDRANT_COLLECTION} already exists"
        else
          echo "Creating collection ${QDRANT_COLLECTION}"
          curl -fsS -X PUT http://qdrant:6333/collections/${QDRANT_COLLECTION} \
            -H "Content-Type: application/json" \
            -d '{"vectors":{"default":{"distance":"Cosine","size":${DENSE_EMBED_DIMENSION:-1024}}},"sparse_vectors":{"bm25":{"modifier":"idf"}}}'
          echo
        fi

        if curl -fsS http://qdrant:6333/collections/${QDRANT_TEST_COLLECTION} >/dev/null; then
          echo "Collection ${QDRANT_TEST_COLLECTION} already exists"
        else
          echo "Creating collection ${QDRANT_TEST_COLLECTION}"
          curl -fsS -X PUT http://qdrant:6333/collections/${QDRANT_TEST_COLLECTION} \
            -H "Content-Type: application/json" \
            -d '{"vectors":{"default":{"distance":"Cosine","size":${DENSE_EMBED_DIMENSION:-1024}}},"sparse_vectors":{"bm25":{"modifier":"idf"}}}'
          echo
        fi
  ollama:
    <<: *service-ollama
    gpus: all

  ollama-init:
    <<: *init-ollama
    restart: "no"

  user_app:
    build:
      context: .
      dockerfile: Dockerfile
    user: "1000:1000"
    networks:
      - backend
    environment:
      DENSE_EMBEDDING_URL: ${DENSE_EMBEDDING_URL:-http://ollama:11434/api/embed}
      DENSE_EMBEDDING_MODEL: ${DENSE_EMBEDDING_MODEL:-mxbai-embed-large:335m}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_TEST_COLLECTION: ${QDRANT_TEST_COLLECTION:-researcher_rag_smoke_test}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-researcher_rag}
      BM25_AVG_LEN: ${BM25_AVG_LEN:-70}
      CHAT_URL: ${CHAT_URL:-http://ollama:11434/api/chat}
      CHAT_MODEL: ${CHAT_MODEL:-gemma4:12b}
      RERANK_URL: ${RERANK_URL:-http://reranker:80/rerank}
      RERANK_MODEL: ${RERANK_MODEL}
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-20}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RERANK_MIN_SCORE: ${RERANK_MIN_SCORE:-0.05}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:?missing}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?missing}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      PYTHONPATH: /app/src
      RP_COLLECTION: ${RP_COLLECTION:-rp_chunks}
      DECISION_URL: ${DECISION_URL:-http://ollama:11434/api/chat}
      DECISION_MODEL: ${DECISION_MODEL:-}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
      # PYTHONPATH: /app/src
      RAG_REPO_ROOT: /app
    volumes:
      - ./fastembed_cache:/cache/fastembed
      - ./src:/app/src    
      - ./config:/app/config
      - ./data:/app/data      
      - ./tests:/app/tests
    working_dir: /app
    # command: ["sleep", "infinity"]
    command: ["python", "-m", "uvicorn", "research_portfolio.web.app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      qdrant-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      reranker:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:2026.10.2-community-ubi10}
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'PORT_HEX="$(printf ''%04X'' 7687)"; cat /proc/net/tcp /proc/net/tcp6 2>/dev/null | grep -q ":$${PORT_HEX} "'
      interval: 10s
      timeout: 3s
      retries: 120
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:?missing}/${NEO4J_PASSWORD:?missing}
      NEO4J_dbms_default__database: "neo4j"
    
  reranker:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:120-1.9}
    container_name: reranker
    networks:
      - backend
    restart: unless-stopped
    command: ["--model-id", "${RERANK_MODEL}", "--port", "80"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./tei_data:/data             
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80 && printf \"GET /health HTTP/1.1\\r\\nHost: x\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s               
    gpus: all                        

