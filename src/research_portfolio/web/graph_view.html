<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Graph · ResearchRAG</title>
<style>
:root{
  --bg:#f7f8fa;--panel:#ffffff;--panel2:#f1f3f6;--text:#1f2937;--muted:#6b7280;--border:#e2e6eb;
  --edge:rgba(148,160,176,.55);--edge-dim:rgba(148,160,176,.12);--accent:#f97316;--accent2:#0b2d5b;
  --label:#111827;--label-bg:rgba(255,255,255,.85);--shadow:0 4px 18px rgba(15,23,42,.10);
}
:root[data-theme=dark]{
  --bg:#0f1115;--panel:#181b21;--panel2:#20242c;--text:#e5e7eb;--muted:#9aa3af;--border:#2a2f38;
  --edge:rgba(120,132,150,.45);--edge-dim:rgba(120,132,150,.08);--label:#e5e7eb;--label-bg:rgba(15,17,21,.8);
  --shadow:0 4px 18px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#kg{position:relative;width:100%;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas.drag{cursor:grabbing}canvas.hover{cursor:pointer}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:5px 10px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.btn.small{padding:2px 8px;font-size:12px}
select,input[type=text],input[type=search]{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:5px 8px;min-width:0}

/* top-left search bar */
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
#searchWrap{position:relative;width:min(340px,100%)}
#search{width:100%;padding:7px 10px 7px 30px}
#searchWrap svg{position:absolute;left:9px;top:9px;opacity:.6}
#sugg{position:absolute;top:calc(100% + 4px);left:0;right:0;max-height:340px;overflow:auto;display:none;z-index:20}
#sugg .it{display:flex;gap:8px;align-items:center;padding:6px 10px;cursor:pointer}
#sugg .it:hover,#sugg .it.on{background:var(--panel2)}
#sugg .dot{width:10px;height:10px;border-radius:50%;flex:none}
#sugg .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sugg .lb{color:var(--muted);font-size:11px}
.ctl{display:flex;gap:6px;align-items:center;padding:4px 6px}
.ctl label{color:var(--muted);font-size:12px}

/* left toolbar */
#tools{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;padding:4px;z-index:5}
#tools button{width:32px;height:32px;border:0;background:transparent;border-radius:7px;display:grid;place-items:center}
#tools button:hover{background:var(--panel2)}
#tools button.on{color:var(--accent)}
#tools hr{border:0;border-top:1px solid var(--border);margin:2px 4px}
.pop{position:absolute;left:56px;bottom:12px;padding:10px;z-index:6;display:none;min-width:220px;max-height:calc(100% - 90px);overflow:auto}
.pop h4{margin:4px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.pop .row{display:flex;align-items:center;gap:8px;padding:3px 0}
.pop .row span.c{margin-left:auto;color:var(--muted);font-size:11px}
.pop .row.dis{opacity:.4}
.pop .acts{display:flex;gap:6px;margin:4px 0 8px}
.lay button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:6px}
.lay button:hover{background:var(--panel2)}

/* legend */
#legend{position:absolute;left:60px;bottom:12px;padding:8px 10px;z-index:4;max-width:min(560px,calc(100% - 420px));display:flex;flex-wrap:wrap;gap:4px 12px}
#legend .lg{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;white-space:nowrap}
#legend .lg.off{opacity:.35;text-decoration:line-through}
#legend .dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--panel)}
#legend .n{color:var(--muted);font-size:11px}

/* status */
#status{position:absolute;right:12px;bottom:12px;padding:6px 10px;z-index:4;display:flex;gap:10px;align-items:center;color:var(--muted)}
#status b{color:var(--text)}

/* right panel */
#panel{position:absolute;top:60px;right:12px;bottom:56px;width:340px;max-width:calc(100% - 24px);z-index:6;display:flex;flex-direction:column;overflow:hidden;transition:transform .18s ease}
#panel.hidden{transform:translateX(calc(100% + 16px))}
#panelHead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}
#panelHead .chip{color:#fff;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:600}
#panelHead h3{margin:0;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#panelBody{padding:10px 12px;overflow:auto;flex:1}
#panelBody .acts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 8px;margin-bottom:12px}
.kv .k{color:var(--muted);word-break:break-word}
.kv .v{word-break:break-word;white-space:pre-wrap}
.kv .v.long{max-height:7.5em;overflow:hidden;position:relative;cursor:pointer}
.kv .v.long.open{max-height:none}
.kv .v.long:not(.open)::after{content:"… more";position:absolute;right:0;bottom:0;background:var(--panel);color:var(--accent);padding-left:6px}
.sec{margin:10px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.rel{display:flex;gap:6px;align-items:center;padding:3px 4px;border-radius:6px;cursor:pointer}
.rel:hover{background:var(--panel2)}
.rel .t{font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 4px;white-space:nowrap}
.rel .dot{width:9px;height:9px;border-radius:50%;flex:none}
.rel .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#panelToggle{position:absolute;top:12px;right:12px;z-index:7}
.empty{color:var(--muted);padding:8px 0}
#toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);padding:8px 14px;z-index:9;display:none;max-width:80%}
#toast.err{border-color:#dc2626;color:#dc2626}
#loading{position:absolute;inset:0;display:none;place-items:center;z-index:8;background:rgba(0,0,0,.04);pointer-events:none}
#loading div{padding:8px 14px}
@media (max-width:700px){#panel{top:auto;height:55%;width:auto;left:12px}#legend{display:none}}
</style>
</head>
<body>
<div id="kg">
  <canvas id="cv" aria-label="Knowledge graph" role="img"></canvas>

  <div id="top">
    <div id="searchWrap" class="card">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search entities…  ( / )" autocomplete="off" aria-label="Search entities">
      <div id="sugg" class="card" role="listbox"></div>
    </div>
    <div class="card ctl">
      <label for="dept">Dept</label>
      <select id="dept"><option value="">All of UTRGV</option></select>
    </div>
    <div class="card ctl">
      <label for="depth">Depth</label>
      <select id="depth"><option>1</option><option>2</option><option>3</option></select>
      <label for="maxn">Max nodes</label>
      <select id="maxn"><option>100</option><option>200</option><option selected>300</option><option>500</option><option>1000</option><option>2000</option></select>
    </div>
    <button id="overviewBtn" class="btn primary card" type="button">Overview</button>
  </div>

  <button id="panelToggle" class="btn card" type="button" aria-expanded="true" title="Hide/show properties (P)">Properties ▸</button>

  <div id="tools" class="card">
    <button type="button" id="tLayout" title="Layout">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7l8 0M7.5 8l3.5 8M17 9l-4 7"/></svg></button>
    <button type="button" id="tPlay" title="Run / pause layout (Space)">
      <svg id="playIco" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l11-7z"/></svg></button>
    <button type="button" id="tFilter" title="Filters">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg></button>
    <button type="button" id="tSettings" title="Display settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <hr>
    <button type="button" id="tZin" title="Zoom in (+)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg></button>
    <button type="button" id="tZout" title="Zoom out (-)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14"/></svg></button>
    <button type="button" id="tFit" title="Fit to screen (F)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button type="button" id="tFull" title="Fullscreen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
    <button type="button" id="tTheme" title="Light / dark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>

  <div id="popLayout" class="pop card lay">
    <h4>Layout</h4>
    <button type="button" data-layout="forceatlas">Force Atlas</button>
    <button type="button" data-layout="force">Force Directed</button>
    <button type="button" data-layout="circular">Circular</button>
    <button type="button" data-layout="circlepack">Circle Pack (by type)</button>
    <button type="button" data-layout="random">Random</button>
    <button type="button" data-layout="noverlap">No Overlap</button>
    <h4 style="margin-top:8px">Pinned nodes</h4>
    <button type="button" id="unpinAll">Unpin all</button>
  </div>

  <div id="popFilter" class="pop card">
    <h4>Node types</h4>
    <div class="acts"><button class="btn small" type="button" data-all="labels">Select all</button><button class="btn small" type="button" data-none="labels">Deselect all</button></div>
    <div id="fLabels"></div>
    <h4 style="margin-top:10px">Relationship types</h4>
    <div class="acts"><button class="btn small" type="button" data-all="rels">Select all</button><button class="btn small" type="button" data-none="rels">Deselect all</button></div>
    <div id="fRels"></div>
    <div class="acts" style="margin-top:10px"><button id="applyFilters" class="btn primary" type="button">Apply</button><button id="resetFilters" class="btn" type="button">Reset</button></div>
  </div>

  <div id="popSettings" class="pop card">
    <h4>Display</h4>
    <label class="row"><input type="checkbox" id="sLabels" checked> Node labels</label>
    <label class="row"><input type="checkbox" id="sEdgeLabels"> Edge labels (all)</label>
    <label class="row"><input type="checkbox" id="sSelEdgeLabels" checked> Edge labels of selection</label>
    <label class="row"><input type="checkbox" id="sArrows" checked> Edge arrows</label>
    <label class="row"><input type="checkbox" id="sCurved"> Curved edges</label>
    <label class="row"><input type="checkbox" id="sHideUnsel"> Hide edges not on selection</label>
    <label class="row"><input type="checkbox" id="sDeg" checked> Size nodes by degree</label>
    <label class="row">Label density <input type="range" id="sDensity" min="1" max="10" value="4" style="flex:1"></label>
    <label class="row">Node size <input type="range" id="sSize" min="5" max="20" value="10" style="flex:1"></label>
    <h4 style="margin-top:8px">Interaction</h4>
    <label class="row"><input type="checkbox" id="sDblExpand" checked> Double-click expands (merge)</label>
    <label class="row"><input type="checkbox" id="sAutoFit" checked> Fit after loading</label>
  </div>

  <div id="legend" class="card"></div>
  <div id="status" class="card"><span id="stTxt">Loading…</span><button id="moreBtn" class="btn small" type="button" style="display:none">Load more</button></div>

  <aside id="panel" class="card" aria-label="Properties">
    <div id="panelHead"><span class="chip" id="pChip" style="display:none"></span><h3 id="pTitle">Properties</h3></div>
    <div id="panelBody"><div class="empty">Click a node to see its properties and relations.<br><br>
      <b>Click</b> select · <b>Double-click</b> expand · <b>Drag</b> move/pin · <b>Wheel</b> zoom · <b>Esc</b> clear</div></div>
  </aside>

  <div id="toast" class="card" role="status" aria-live="polite"></div>
  <div id="loading"><div class="card">Loading graph…</div></div>
</div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const API = "";
const cv = $("#cv"), ctx = cv.getContext("2d");
const root = document.documentElement;

/* ------------------------------------------------------------ state */
const nodes = new Map(), edges = new Map(), adj = new Map();
let meta = {labels: [], relationships: [], departments: []};
let view = {x: 0, y: 0, k: 1};
let W = 0, H = 0, DPR = 1;
let hover = null, selected = null, dragNode = null, panning = null, moved = false;
let pendingFit = false, alpha = 0, running = false, layoutKind = "forceatlas";
let hiddenLabels = new Set();             // legend toggles (client-side)
let filt = {labels: new Set(), rels: new Set()}; // empty = all
let ctxView = {mode: "overview", id: null, skip: 0, total: 0, returned: 0};
const S = {labels: true, edgeLabels: false, selEdgeLabels: true, arrows: true, curved: false,
           hideUnsel: false, degSize: true, density: 4, size: 10, dblExpand: true, autoFit: true};

/* ------------------------------------------------------------ colors */
const FIXED = {Person: "#4e79f6", Faculty: "#4e79f6", Publication: "#9b6bdf", Grant: "#36b37e",
  Presentation: "#f5a524", Department: "#64748b", College: "#475569", School: "#475569",
  Topic: "#ec5f9e", Keyword: "#ec5f9e", Sponsor: "#14b8a6", Organization: "#0ea5e9",
  Chunk: "#a3a3a3", Document: "#a3a3a3"};
const PAL = ["#e8684a","#5ad8a6","#6dc8ec","#9270ca","#ff9d4d","#269a99","#ff99c3","#5d7092","#c2a04c","#7cb305"];
const colorCache = {};
function colorOf(label) {
  if (FIXED[label]) return FIXED[label];
  if (!colorCache[label]) { let h = 0; for (const c of label) h = (h * 31 + c.charCodeAt(0)) >>> 0; colorCache[label] = PAL[h % PAL.length]; }
  return colorCache[label];
}
const css = v => getComputedStyle(root).getPropertyValue(v).trim();

/* ------------------------------------------------------------ helpers */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg, err) {
  const t = $("#toast"); t.textContent = msg; t.className = "card" + (err ? " err" : "");
  t.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = "none", err ? 7000 : 3500);
}
function loading(on) { $("#loading").style.display = on ? "grid" : "none"; }
function qs(o) { return Object.entries(o).filter(([, v]) => v !== "" && v != null).map(([k, v]) => k + "=" + encodeURIComponent(v)).join("&"); }
function filterParams() { return {labels: [...filt.labels].join(","), rels: [...filt.rels].join(",")}; }
async function getJSON(path, params) {
  const r = await fetch(API + path + (params ? "?" + qs(params) : ""));
  if (!r.ok) { let d = ""; try { d = (await r.json()).detail; } catch (e) {} throw new Error(d || r.status + " " + r.statusText); }
  return r.json();
}

/* ------------------------------------------------------------ graph model */
function radius(n) {
  const base = S.size * 0.75;
  return S.degSize ? Math.min(base + 2.4 * Math.sqrt(n.degree || 0), base * 4) : base;
}
function addNode(d, near) {
  let n = nodes.get(d.id);
  if (n) { Object.assign(n, {degree: d.degree ?? n.degree, props: d.props || n.props, name: d.name || n.name}); return n; }
  const a = Math.random() * Math.PI * 2, r = near ? 30 + Math.random() * 40 : 200 * Math.sqrt(Math.random());
  n = {...d, x: (near ? near.x : 0) + Math.cos(a) * r, y: (near ? near.y : 0) + Math.sin(a) * r, vx: 0, vy: 0, fixed: false};
  nodes.set(d.id, n); adj.set(d.id, new Set());
  return n;
}
function addEdge(e) {
  if (edges.has(e.id) || !nodes.has(e.source) || !nodes.has(e.target)) return;
  edges.set(e.id, e); adj.get(e.source).add(e.target); adj.get(e.target).add(e.source);
}
function removeNode(id) {
  for (const [eid, e] of edges) if (e.source === id || e.target === id) {
    edges.delete(eid); adj.get(e.source)?.delete(e.target); adj.get(e.target)?.delete(e.source);
  }
  nodes.delete(id); adj.delete(id);
  if (selected === id) select(null);
}
function clearGraph() { nodes.clear(); edges.clear(); adj.clear(); hover = null; selected = null; }
function merge(g, nearId) {
  const near = nearId ? nodes.get(nearId) : null;
  g.nodes.forEach(d => addNode(d, near));
  g.edges.forEach(addEdge);
}
function visible(n) { return !hiddenLabels.has(n.label); }

/* ------------------------------------------------------------ loading views */
async function loadOverview() {
  loading(true);
  try {
    const dept = $("#dept").value;
    const g = await getJSON("/api/kg/overview", {limit: $("#maxn").value, dept, ...filterParams()});
    clearGraph(); merge(g);
    ctxView = {mode: dept ? "department" : "overview", id: null, dept, total: g.total, returned: g.nodes.length};
    afterLoad(true);
  } catch (e) { toast("Could not load graph: " + e.message, true); }
  finally { loading(false); }
}
async function loadFocus(id, keep) {
  loading(true);
  try {
    const g = await getJSON("/api/kg/neighbors", {id, depth: $("#depth").value, limit: $("#maxn").value, ...filterParams()});
    const prev = nodes.get(id);
    if (!keep) clearGraph();
    merge(g, keep ? id : null);
    if (!keep) { const c = nodes.get(id); if (c) { c.x = 0; c.y = 0; } }
    else if (prev) { /* keep position */ }
    ctxView = {mode: keep ? ctxView.mode : "focus", id, skip: 0, total: g.total, returned: g.returned, has_more: g.has_more};
    afterLoad(!keep);
    select(id);
    if (g.has_more) toast(`Showing ${g.returned} of ${g.total} connections — use “Load more”.`);
  } catch (e) { toast("Could not load neighborhood: " + e.message, true); }
  finally { loading(false); }
}
async function loadMore() {
  if (!ctxView.id) { $("#maxn").value = String(Math.min(2000, +$("#maxn").value * 2)); return loadOverview(); }
  loading(true);
  try {
    const skip = (ctxView.skip || 0) + (ctxView.returned || 0);
    const g = await getJSON("/api/kg/neighbors", {id: ctxView.id, depth: $("#depth").value, limit: $("#maxn").value, skip, ...filterParams()});
    merge(g, ctxView.id);
    ctxView = {...ctxView, skip, returned: g.returned, has_more: g.has_more, total: g.total};
    afterLoad(false);
  } catch (e) { toast(e.message, true); }
  finally { loading(false); }
}
function afterLoad(fresh) {
  if (fresh) {
    runLayout(layoutKind === "forceatlas" || layoutKind === "force" ? layoutKind : "forceatlas", true);
    const t0 = performance.now();                 // pre-settle off-screen, then animate the rest
    while (alpha > 0.15 && performance.now() - t0 < 350) tick();
    if (S.autoFit) fit(null, true);
    pendingFit = S.autoFit;
  } else reheat(0.5);
  renderLegend(); updateStatus();
}
function updateStatus() {
  let shown = 0; nodes.forEach(n => visible(n) && shown++);
  const scope = ctxView.mode === "focus" ? "Neighborhood" : ctxView.mode === "department" ? "Department" : "Overview";
  let txt = `${scope}: <b>${shown}</b> nodes · <b>${edges.size}</b> edges`;
  let more = false;
  if (ctxView.mode === "focus" && ctxView.has_more) { txt += ` · ${ctxView.skip + ctxView.returned}/${ctxView.total} connections`; more = true; }
  else if (ctxView.mode !== "focus" && ctxView.total > nodes.size) { txt += ` · of ${ctxView.total}`; more = +$("#maxn").value < 2000; }
  $("#stTxt").innerHTML = txt; $("#moreBtn").style.display = more ? "" : "none";
}

/* ------------------------------------------------------------ layout */

  $("#legend").style.display = keys.length ? "" : "none";
  $("#legend").innerHTML = keys.map(k => `<span class="lg${hiddenLabels.has(k) ? " off" : ""}" data-k="${esc(k)}" role="button" tabindex="0" title="Show/hide ${esc(k)}">
    <span class="dot" style="background:${colorOf(k)}"></span>${esc(k)} <span class="n">${counts[k]}</span></span>`).join("");
  $("#legend").querySelectorAll(".lg").forEach(el => {
    const tog = () => { const k = el.dataset.k; hiddenLabels.has(k) ? hiddenLabels.delete(k) : hiddenLabels.add(k); renderLegend(); updateStatus(); };
    el.addEventListener("click", tog); el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tog(); } });
  });
}

/* ------------------------------------------------------------ search */
let sTimer = null, sItems = [], sIdx = -1;
$("#search").addEventListener("input", () => {
  clearTimeout(sTimer); const q = $("#search").value.trim();
  if (q.length < 2) { $("#sugg").style.display = "none"; return; }
  sTimer = setTimeout(async () => {
    try { sItems = await getJSON("/api/kg/search", {q, limit: 15, labels: [...filt.labels].join(",")}); }
    catch (e) { sItems = []; }
    sIdx = -1; renderSugg();
  }, 220);
});
function renderSugg() {
  const box = $("#sugg");
  if (!sItems.length) { box.innerHTML = '<div class="it"><span class="nm" style="color:var(--muted)">No matches</span></div>'; box.style.display = "block"; return; }
  box.innerHTML = sItems.map((s, i) => `<div class="it${i === sIdx ? " on" : ""}" data-i="${i}" role="option">
     <span class="dot" style="background:${colorOf(s.label)}"></span><span class="nm">${esc(s.name)}</span>
     <span class="lb">${esc(s.label)} · ${s.degree}</span></div>`).join("");
  box.style.display = "block";
  box.querySelectorAll(".it[data-i]").forEach(el => el.addEventListener("mousedown", e => { e.preventDefault(); pick(+el.dataset.i); }));
}
function pick(i) { const s = sItems[i]; if (!s) return; $("#sugg").style.display = "none"; $("#search").value = s.name; $("#search").blur(); loadFocus(s.id, false); }
$("#search").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { sIdx = Math.min(sItems.length - 1, sIdx + 1); renderSugg(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { sIdx = Math.max(0, sIdx - 1); renderSugg(); e.preventDefault(); }
  else if (e.key === "Enter") { pick(sIdx < 0 ? 0 : sIdx); }
});
$("#search").addEventListener("blur", () => setTimeout(() => $("#sugg").style.display = "none", 150));

/* ------------------------------------------------------------ toolbar & popovers */
function closePops() { document.querySelectorAll(".pop").forEach(p => p.style.display = "none"); ["#tLayout","#tFilter","#tSettings"].forEach(s => $(s).classList.remove("on")); }
function togglePop(btn, pop) { const open = $(pop).style.display === "block"; closePops(); if (!open) { $(pop).style.display = "block"; $(btn).classList.add("on"); } }
$("#tLayout").addEventListener("click", () => togglePop("#tLayout", "#popLayout"));
$("#tFilter").addEventListener("click", () => { renderFilters(); togglePop("#tFilter", "#popFilter"); });
$("#tSettings").addEventListener("click", () => togglePop("#tSettings", "#popSettings"));
$("#tPlay").addEventListener("click", () => running ? stop() : reheat(0.7));
$("#tZin").addEventListener("click", () => zoomAt(1.3));
$("#tZout").addEventListener("click", () => zoomAt(1 / 1.3));
$("#tFit").addEventListener("click", () => fit());
$("#tFull").addEventListener("click", () => { const el = $("#kg"); document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen?.(); });
$("#tTheme").addEventListener("click", () => { const d = root.dataset.theme === "dark" ? "light" : "dark"; root.dataset.theme = d; try { localStorage.setItem("kgTheme", d); } catch (e) {} });
document.querySelectorAll("[data-layout]").forEach(b => b.addEventListener("click", () => { runLayout(b.dataset.layout, false); closePops(); }));
$("#unpinAll").addEventListener("click", () => { nodes.forEach(n => n.fixed = false); reheat(0.4); closePops(); });
$("#overviewBtn").addEventListener("click", () => { $("#search").value = ""; loadOverview(); });
$("#dept").addEventListener("change", loadOverview);
$("#moreBtn").addEventListener("click", loadMore);

const bindS = (id, key, num) => $(id).addEventListener(num ? "input" : "change", e => { S[key] = num ? +e.target.value : e.target.checked; if (key === "size" || key === "degSize") noverlap(20); });
bindS("#sLabels", "labels"); bindS("#sEdgeLabels", "edgeLabels"); bindS("#sSelEdgeLabels", "selEdgeLabels");
bindS("#sArrows", "arrows"); bindS("#sCurved", "curved"); bindS("#sHideUnsel", "hideUnsel"); bindS("#sDeg", "degSize");
bindS("#sDensity", "density", 1); bindS("#sSize", "size", 1); bindS("#sDblExpand", "dblExpand"); bindS("#sAutoFit", "autoFit");

/* ------------------------------------------------------------ filters (dynamic from meta) */
let draft = null;
function renderFilters() {
  if (!draft) draft = {labels: new Set(filt.labels.size ? filt.labels : meta.labels.map(l => l.name)),
                       rels: new Set(filt.rels.size ? filt.rels : meta.relationships.map(r => r.name))};
  const row = (kind, it) => {
    const on = draft[kind].has(it.name), dis = it.count === 0;
    return `<label class="row${dis ? " dis" : ""}"><input type="checkbox" data-k="${kind}" value="${esc(it.name)}" ${on ? "checked" : ""} ${dis ? "disabled" : ""}>
      ${kind === "labels" ? `<span class="dot" style="width:10px;height:10px;border-radius:50%;background:${colorOf(it.name)}"></span>` : ""}
      ${esc(it.name)}<span class="c">${it.count}</span></label>`;
  };
  $("#fLabels").innerHTML = meta.labels.map(l => row("labels", l)).join("") || '<div class="empty">No node types</div>';
  $("#fRels").innerHTML = meta.relationships.map(r => row("rels", r)).join("") || '<div class="empty">No relationships</div>';
  $("#popFilter").querySelectorAll("input[data-k]").forEach(cb => cb.addEventListener("change", () => {
    cb.checked ? draft[cb.dataset.k].add(cb.value) : draft[cb.dataset.k].delete(cb.value); }));
}
document.querySelectorAll("[data-all]").forEach(b => b.addEventListener("click", () => {
  const k = b.dataset.all; draft[k] = new Set((k === "labels" ? meta.labels : meta.relationships).map(x => x.name)); renderFilters(); }));
document.querySelectorAll("[data-none]").forEach(b => b.addEventListener("click", () => { draft[b.dataset.none] = new Set(); renderFilters(); }));
$("#applyFilters").addEventListener("click", () => {
  if (!draft.labels.size) { toast("Select at least one node type.", true); return; }
  const allL = draft.labels.size === meta.labels.length, allR = draft.rels.size === meta.relationships.length;
  if (!draft.rels.size) { toast("Select at least one relationship type.", true); return; }
  filt = {labels: allL ? new Set() : new Set(draft.labels), rels: allR ? new Set() : new Set(draft.rels)};
  $("#tFilter").style.color = (filt.labels.size || filt.rels.size) ? "var(--accent)" : "";
  closePops(); draft = null;
  if (ctxView.mode === "focus" && ctxView.id) loadFocus(ctxView.id, false); else loadOverview();
});
$("#resetFilters").addEventListener("click", () => { draft = null; filt = {labels: new Set(), rels: new Set()}; $("#tFilter").style.color = ""; renderFilters(); });

/* ------------------------------------------------------------ boot */
(function init() {
  let th = null; try { th = localStorage.getItem("kgTheme"); } catch (e) {}
  root.dataset.theme = th || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  if (W === 0) resize();
  requestAnimationFrame(frame);
  getJSON("/api/kg/meta").then(m => {
    meta = m;
    $("#dept").innerHTML = '<option value="">All of UTRGV</option>' + (m.departments || []).map(d =>
      `<option value="${esc(d.slug)}">${esc(d.name)}${d.members ? " (" + d.members + ")" : ""}</option>`).join("");
    const p = new URLSearchParams(location.search);
    if (p.get("dept")) $("#dept").value = p.get("dept");
    if (p.get("focus")) return loadFocus(p.get("focus"), false);
    if (p.get("q")) return getJSON("/api/kg/search", {q: p.get("q"), limit: 1}).then(r => r[0] ? loadFocus(r[0].id, false) : loadOverview());
    return loadOverview();
  }).catch(e => { toast("Graph API unavailable: " + e.message, true); $("#stTxt").textContent = "Graph API unavailable"; });
})();
})();
</script>
</body>
</html>
